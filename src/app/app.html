<a class="skip-link" href="#main-content">Skip to main content</a>
<div class="app-layout">
  <aside class="sidebar" aria-label="Primary navigation">
    <a class="brand" routerLink="/" aria-label="CardNest home">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span></span>
      <span><strong>CardNest</strong><small>Money, organised.</small></span>
    </a>
    <nav>
      <a routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="active"
        ><span aria-hidden="true">⌂</span> Overview</a
      >
      <a routerLink="/cards" routerLinkActive="active"><span aria-hidden="true">▣</span> Cards</a>
      <a routerLink="/transactions" routerLinkActive="active"
        ><span aria-hidden="true">↕</span> Transactions</a
      >
      <a routerLink="/reminders" routerLinkActive="active"
        ><span aria-hidden="true">◷</span> Reminders</a
      >
      <a routerLink="/reports" routerLinkActive="active"
        ><span aria-hidden="true">⌁</span> Reports</a
      >
    </nav>
    <div class="sidebar-footer">
      <a routerLink="/settings" routerLinkActive="active"
        ><span aria-hidden="true">⚙</span> Settings</a
      >
      <div class="privacy">
        <span aria-hidden="true">✓</span
        ><span
          ><strong>Private by design</strong><small>Your data stays on this device</small></span
        >
      </div>
    </div>
  </aside>
  <main id="main-content" tabindex="-1"><router-outlet /></main>
  <nav class="bottom-nav" aria-label="Primary navigation">
    <a routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="active"
      ><span aria-hidden="true">⌂</span><small>Home</small></a
    >
    <a routerLink="/cards" routerLinkActive="active"
      ><span aria-hidden="true">▣</span><small>Cards</small></a
    >
    <a
      class="add-action"
      routerLink="/transactions"
      [queryParams]="{ add: true }"
      aria-label="Add transaction"
      ><span aria-hidden="true">+</span></a
    >
    <a routerLink="/transactions" routerLinkActive="active"
      ><span aria-hidden="true">↕</span><small>Activity</small></a
    >
    <a routerLink="/settings" routerLinkActive="active"
      ><span aria-hidden="true">⚙</span><small>Settings</small></a
    >
  </nav>
</div>
