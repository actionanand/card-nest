name: Android release safety checks

on:
  push:
    paths:
      - '.github/workflows/android-build.yml'
      - '.github/workflows/android-release-checks.yml'
      - 'scripts/*android-release*'
      - 'scripts/bump-android-version.js'
      - 'android-version.json'
  pull_request:
    paths:
      - '.github/workflows/android-build.yml'
      - '.github/workflows/android-release-checks.yml'
      - 'scripts/*android-release*'
      - 'scripts/bump-android-version.js'
      - 'android-version.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node --test scripts/android-release.test.mjs
